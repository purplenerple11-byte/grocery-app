name: Supabase keepalive

# Free-tier Supabase projects pause after ~1 week of inactivity. When that
# happens every household device shows a sync error until someone opens the
# dashboard, so this pings the project twice a week (max gap 3-4 days).
#
# It calls public.keepalive() — a no-argument, no-table, constant-returning
# function granted to `anon` precisely so this workflow needs no secret.
# See supabase/schema.sql.
#
# NOTE: GitHub disables scheduled workflows in a repository with no activity
# for 60 days. If the repo goes quiet that long, re-enable it in the Actions
# tab (or just run it manually below).

on:
  schedule:
    - cron: '0 6 * * 1,4'   # Mondays and Thursdays, 06:00 UTC
  workflow_dispatch:         # run by hand — use this to verify after any change

# Nothing here writes to the repo.
permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # URL and publishable key are read from assets/sync-config.js rather than
      # duplicated here, so there is exactly one source of truth and no chance
      # of this workflow quietly pinging a stale project after a key rotation.
      # Both values are public by design (RLS is on, `anon` is revoked).
      - name: Ping keepalive()
        run: |
          set -euo pipefail
          cfg=assets/sync-config.js
          url=$(sed -n "s/^[[:space:]]*url:[[:space:]]*'\([^']*\)'.*/\1/p" "$cfg" | head -1)
          key=$(sed -n "s/^[[:space:]]*key:[[:space:]]*'\([^']*\)'.*/\1/p" "$cfg" | head -1)

          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::error::Could not read url/key out of $cfg — has its shape changed?"
            exit 1
          fi
          echo "Pinging $url"

          code=$(curl -sS -o /tmp/keepalive-body -w '%{http_code}' \
            -X POST "$url/rest/v1/rpc/keepalive" \
            -H "apikey: $key" \
            -H "Content-Type: application/json" \
            -d '{}' --max-time 30 --retry 2 --retry-delay 5)

          echo "HTTP $code — $(cat /tmp/keepalive-body)"

          # Fail loudly. A keepalive that silently stops working is worse than
          # none at all: the project pauses and the first symptom is every
          # device reporting a sync error days later.
          if [ "$code" = "404" ]; then
            echo "::error::keepalive() is missing from the LIVE project. supabase/schema.sql is a record, not a migration — paste it into the SQL editor. See gotcha #8 in HANDOFF.md."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::keepalive() returned HTTP $code, expected 200."
            exit 1
          fi
          echo "Project is awake."
